<svg xmlns="http://www.w3.org/2000/svg" width="222" height="224" viewBox="0 0 222 224" fill="none">
  <style>
    :root, svg {
      /* Light theme: airy blue-grays + vivid blue/cyan */
      --idle: #8FA0B5;
      --active-dot:  #3B9EFF;
      --active-line: #22D3EE;
      --text: #5B6675;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        /* Dark theme: lifted, glowing-feeling tones */
        --idle: #8494AB;
        --active-dot:  #60B5FF;
        --active-line: #56E6F2;
        --text: #C6CEDB;
      }
    }
  </style>

  <!-- Left rounded bracket rail: large smooth bends, caps reach near ring outer edge -->
  <path d="M 88.5 24 H 68 A 8 8 0 0 0 60 32 V 153 A 8 8 0 0 0 68 161 H 88.5"
        stroke="var(--idle)" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Item 1 (inactive): bar first, hollow ring on top; same weight & color fuse seamlessly -->
  <line x1="91" y1="46" x2="162" y2="46" stroke="var(--idle)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="84" cy="46" r="7" stroke="var(--idle)" stroke-width="5"/>

  <!-- Item 2 (active): bar tucks under the filled dot, which is painted after -->
  <line x1="92" y1="78" x2="162" y2="78" stroke="var(--active-line)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="84" cy="78" r="9" fill="var(--active-dot)"/>

  <!-- Item 3 (inactive) -->
  <line x1="91" y1="110" x2="162" y2="110" stroke="var(--idle)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="84" cy="110" r="7" stroke="var(--idle)" stroke-width="5"/>

  <!-- Item 4 (inactive) -->
  <line x1="91" y1="141" x2="162" y2="141" stroke="var(--idle)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="84" cy="141" r="7" stroke="var(--idle)" stroke-width="5"/>

  <!-- Label -->
  <text x="111" y="199"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="14"
        fill="var(--text)">scroll-active-toc</text>
</svg>
